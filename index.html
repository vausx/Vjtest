<html lang="fa" dir="rtl"><head><meta charset="utf-8">

<style>
:root{--bg:#050805;--card:#0d130e;--line:#1b2a1d;--g:#22e06b;--g2:#10a64a;--m:#9db3a2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;overflow-x:hidden;background-image:radial-gradient(600px 400px at 85% -5%,#22e06b22,transparent)}
a{color:inherit;text-decoration:none;cursor:pointer}
.w{max-width:1080px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:#050805e6;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:66px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.logo img{width:42px;height:42px;mix-blend-mode:screen;object-fit:contain}.logo b{color:var(--g)}
.links{display:flex;gap:18px;font-size:14px;color:var(--m);overflow-x:auto}
.links a.on,.links a:hover{color:var(--g)}
.btn{display:inline-block;background:linear-gradient(135deg,var(--g),var(--g2));color:#03160a;border:0;border-radius:12px;padding:10px 22px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 0 22px #22e06b40}
.btn.o{background:none;color:#fff;border:1px solid var(--line);box-shadow:none}.btn.r{background:#ff5a5a;color:#fff;box-shadow:none}.btn.s{padding:4px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
h1{font-size:clamp(28px,6vw,52px);line-height:1.5;font-weight:800}h1 span{color:var(--g)}
h2{font-size:28px;text-align:center;margin-bottom:6px}.sub{text-align:center;color:var(--m);margin-bottom:30px}
.pg{padding:50px 0}.c{text-align:center}.m{color:var(--m)}.g{color:var(--g)}
.pop{border-color:var(--g);box-shadow:0 0 36px #22e06b22}
.pr{font-size:30px;font-weight:800;color:var(--g)}
.plan ul{list-style:none;padding:0;margin:12px 0 16px;color:var(--m);font-size:14px}.plan li:before{content:"✓ ";color:var(--g)}
input,textarea,select{width:100%;background:#050805;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px;margin:4px 0 10px;font:inherit}
.bd{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;background:#333}.bd.pending{background:#a77b0a}.bd.accepted{background:var(--g2)}.bd.rejected{background:#b33}
.ann{background:linear-gradient(90deg,#0f2a17,#07140b);border-bottom:1px solid var(--g2);text-align:center;padding:6px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs a{padding:6px 16px;border:1px solid var(--line);border-radius:99px;font-size:14px}.tabs a.on{background:var(--g);color:#03160a;font-weight:800}
.st b{display:block;font-size:26px;color:var(--g)}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar i{flex:1;background:linear-gradient(var(--g),var(--g2));border-radius:6px 6px 0 0;min-height:3px;position:relative}
.bar i span{position:absolute;top:-20px;width:100%;text-align:center;font-size:12px;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
#fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;border-radius:99px;padding:13px 20px}
#chat{position:fixed;left:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 28px));z-index:9;display:none;padding:14px}
.msgs{height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.mg{max-width:80%;padding:6px 12px;border-radius:12px;font-size:14px;background:#16301d;align-self:flex-start}.mg.me{background:var(--g2);align-self:flex-end}
.modal{position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:16px;display:none}.modal .card{max-width:480px;margin:20px auto;border-color:var(--g2)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--m);font-size:14px;margin-top:30px}
@media(max-width:700px){.links{font-size:12px;gap:12px}.logo span{display:none}}
.logo span{display:inline!important}
#bg{background:none;border:1px solid var(--line);color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;transition:.25s}#bg:hover{border-color:var(--g);color:var(--g);transform:rotate(90deg)}
#dr{position:fixed;top:0;right:0;height:100%;width:min(320px,86vw);background:#080d09;border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto}#dr.on{transform:none}
#ov{position:fixed;inset:0;background:#000a;z-index:29;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(3px)}#ov.on{opacity:1;pointer-events:auto}
.di{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:6px;border:1px solid transparent;transition:.2s}.di:hover{background:#0f1a11;border-color:var(--line);transform:translateX(-4px)}.di.on{background:#10281a;border-color:var(--g2)}
.ib{width:42px;height:42px;border-radius:12px;background:#12301c;color:var(--g);display:grid;place-items:center;flex:none}.di small{display:block;color:var(--m);font-size:12px;line-height:1.5}
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 34px #22e06b80}.btn:active{transform:scale(.95)}
.btn:before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:skewX(-20deg);transition:.6s}.btn:hover:before{left:130%}
.rp{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff7;transform:translate(-50%,-50%) scale(0);animation:rp .6s;pointer-events:none}@keyframes rp{to{transform:translate(-50%,-50%) scale(32);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fl{50%{transform:translateY(-14px)}}
#app>*{animation:up .5s both}.card{transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-5px);border-color:var(--g);box-shadow:0 12px 40px #22e06b18}
.hero{position:relative;text-align:center;padding:70px 20px 40px}.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(#22e06b30,transparent 70%);top:0;right:5%;animation:fl 6s infinite;z-index:-1}
.tg{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--g);padding:4px 16px;border-radius:99px;font-size:13px;margin-bottom:18px}.tg:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
#fab{width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:50%}
.logo img{mix-blend-mode:normal!important;filter:drop-shadow(0 0 8px #22e06b66)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 82% 0,#22e06b28,transparent),radial-gradient(420px 420px at 8% 55%,#10a64a1e,transparent),linear-gradient(#ffffff07 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/46px 46px}
#app>*{animation:none}#app.anim>*{animation:up .55s both}
h1 span{background:linear-gradient(90deg,#22e06b,#c4ffd9,#22e06b);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}@keyframes sh{to{background-position:200%}}
.hl{width:118px;height:auto;margin:0 auto 14px;display:block;filter:drop-shadow(0 0 30px #22e06b99);animation:fl 5s ease-in-out infinite}
.plan{overflow:visible}.plan.pop{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--g),#0b3a1c) border-box;border:1px solid transparent;transform:scale(1.03)}.plan.pop:hover{transform:scale(1.05) translateY(-4px)}
.rb{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--g);color:#03160a;font-size:12px;font-weight:800;padding:2px 16px;border-radius:99px;box-shadow:0 0 18px #22e06b80}
.plan li{display:flex;gap:8px;align-items:center;justify-content:center;padding:4px 0}.plan li:before{content:none}.plan li svg{color:var(--g);flex:none}
.cta{background:linear-gradient(135deg,#0f2a17,#07140b);border:1px solid var(--g2);border-radius:26px;text-align:center;padding:44px 20px;position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(#22e06b30,transparent 70%);top:-120px;left:-60px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;transition:.25s}details:hover,details[open]{border-color:var(--g2)}summary{cursor:pointer;font-weight:600}details p{color:var(--m);margin-top:8px;font-size:14px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#10281a;border:1px solid var(--g2);padding:10px 22px;border-radius:14px;z-index:50;animation:up .3s;transition:opacity .4s;box-shadow:0 8px 30px #000a}.toast.out{opacity:0}
.sp{padding:0;overflow:hidden}.sp .hd{display:flex;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#0a1a0f}.sp .msgs{height:min(55vh,460px);padding:16px;margin:0}.sp .ft{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}.sp .ft input{margin:0;flex:1}
.mg{animation:up .3s both}.mg small{display:block;font-size:10px;opacity:.6}

function snap(name,fn,q){var c=S.db.collection(name);if(q)c=c.where("uid","==",q);return c.onSnapshot(function(s){S[fn]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});draw()},function(e){console.warn(name,e.code)})}

 subs.push(snap("plans","plans"),snap("announcements","ann"));
 subs.push(S.db.doc("config/site").onSnapshot(function(d){S.site=d.data()||{};CARD=TT("card");HOLDER=TT("holder");draw()},function(){}));
 if(S.uid){subs.push(snap("orders","orders",me),snap("messages","msgs",me));if(S.owner)subs.push(snap("visits","visits"))}else{S.orders=[];S.msgs=[];S.visits=[]}}

function upl(f){return new Promise(function(ok,no){var r=new FileReader();r.onerror=no;r.onload=function(){var i=new Image();i.onerror=no;i.onload=function(){var k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok({url:c.toDataURL("image/jpeg",.7)})};i.src=r.result};r.readAsDataURL(f)})}
